version: "3.9"

services:
  test-db:
    image: postgres:15
    container_name: db_test_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: makeway_test
    ports:
      - "5434:5432"  # Expose for debugging (optional)
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  backend-test:
    build:
      context: ./Backend
    container_name: backend_test
    depends_on:
      test-db:
        condition: service_healthy
    env_file:
      - ./Backend/app/tests/.env.test
    environment:
      PYTHONPATH: /app
    volumes:
      - ./Backend/app:/app
    working_dir: /app
    command: >
      sh -c "sleep 5 && pytest tests"
    restart: "no"
    stdin_open: true
    tty: true
    # Run using: docker-compose -f docker-compose.test.yml run --rm test

volumes:
  postgres_test_data:
